name: farmabi-debezium

services:
  zookeeper:
    image: debezium/zookeeper:2.7.3.Final
    container_name: farmabi-debezium-zookeeper
    ports:
      - "52181:2181"
    networks:
      - farmabi-net
    healthcheck:
      test: echo srvr | nc -z localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: debezium/kafka:2.7.3.Final
    container_name: farmabi-debezium-kafka
    ports:
      - "59092:9092"
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - farmabi-net
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: farmabi-debezium-kafka-ui
    restart: unless-stopped
    ports:
      - "58085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: farmabi-debezium
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - farmabi-net

  connect:
    image: debezium/connect:2.7.3.Final
    container_name: farmabi-debezium-connect
    ports:
      - "58083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: "connect_configs"
      OFFSET_STORAGE_TOPIC: "connect_offsets"
      STATUS_STORAGE_TOPIC: "connect_statuses"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - farmabi-net
    healthcheck:
      test: curl -f http://localhost:8083 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  farmabi-net:
    external: true
    name: farmabi-net
