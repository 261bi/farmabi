name: farmabi-oltp

services:
  mysql-farma-oltp:
    image: mysql:8.0
    container_name: farmabi-oltp-mysql
    restart: unless-stopped
    command:
      - --server-id=223344
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: farma_oltp_db
      TZ: America/Lima
    ports:
      - "53306:3306"
    volumes:
      - farma_oltp_db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks:
      - farmabi-net

volumes:
  farma_oltp_db_data:

networks:
  farmabi-net:
    name: farmabi-net
